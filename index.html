<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKILLS | Sales Practice Lab</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#152a45;background:#f1f5fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(130deg,#112740,#235188)}.login-card{background:white;border-radius:22px;max-width:420px;width:100%;padding:34px;box-shadow:0 20px 80px #001b3544}.login h1{margin:8px 0}.login input{padding:14px;width:100%;border:1px solid #b8c7d8;border-radius:10px;font-size:22px;letter-spacing:5px}.primary{background:#174779;color:white;padding:13px 20px;border-radius:11px;font-weight:700}.primary:hover{background:#245e99}.muted{color:#62758d}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.sidebar{background:#142a45;color:#e7effa;padding:25px 14px;display:flex;flex-direction:column;gap:18px}.brand{font-size:24px;font-weight:800;letter-spacing:1px;padding:8px 12px}.brand small{display:block;font-size:12px;font-weight:400;letter-spacing:0}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#d8e6f8;text-align:left;padding:13px 14px;border-radius:10px}.nav button.active,.nav button:hover{background:#245b9d;color:white}.side-bottom{margin-top:auto;padding:12px}.side-bottom button{border:1px solid #607a9c;border-radius:9px;padding:10px;color:white;background:transparent;width:100%}.main{padding:28px;max-width:1450px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}h1{margin:0;font-size:30px}h2{margin:0 0 12px;font-size:22px}h3{margin:0 0 10px}.card{background:white;border:1px solid #e0e8f2;border-radius:18px;padding:20px;box-shadow:0 5px 20px #19344b0a;margin-bottom:18px}.two-col{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,.85fr);gap:18px}.scene{height:360px;position:relative;border-radius:15px;overflow:hidden;background:linear-gradient(130deg,#c4d4e4,#eff4fa);display:flex;align-items:end;justify-content:center}.scene svg{width:100%;height:100%;position:absolute;inset:0}.bubble{position:absolute;right:5%;top:8%;max-width:49%;background:white;border-radius:19px;padding:18px 20px;box-shadow:0 7px 25px #10263e30;line-height:1.5;font-weight:550;font-size:16px}.bubble:after{content:"";position:absolute;bottom:-15px;left:24px;border:9px solid transparent;border-top-color:white}.answers{display:grid;gap:10px;margin-top:15px}.answer{background:#f6f9fd;color:#172f4d;border:1px solid #d5e0ed;text-align:left;padding:15px;border-radius:12px;display:flex;gap:13px;align-items:center;line-height:1.45}.answer:hover:not(:disabled),.answer.selected{background:#e5f0ff;border-color:#7ca9db}.letter{background:#dbe5f0;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-weight:700;flex-shrink:0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:15px;flex-wrap:wrap}.pill{background:#e6eff8;color:#245180;padding:6px 11px;border-radius:50px;font-size:13px}.feedback{background:#edf6ff;border-left:4px solid #2a78bd;border-radius:8px;padding:14px;margin-top:15px;line-height:1.5}.feedback.good{background:#ecf9f1;border-color:#26915a}.profile{display:flex;gap:12px;align-items:center}.avatar{width:55px;height:55px;border-radius:50%;background:#d8e9f8;display:grid;place-items:center;font-size:29px}.stepbar{display:flex;gap:5px;margin:12px 0}.stepbar span{height:7px;background:#dce6f0;flex:1;border-radius:5px}.stepbar span.done{background:#4ca77c}.stepbar span.current{background:#245c9d}.scenario-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.scenario{padding:20px;background:white;border:1px solid #dbe5ef;border-radius:16px;text-align:left;color:#18334f}.scenario:hover{border-color:#3578b9;box-shadow:0 8px 24px #0d3d6a1a}.scenario strong{display:block;font-size:18px;margin:9px 0}.scenario p{color:#60758b;line-height:1.5}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{background:#f2f6fb;border-radius:12px;padding:16px}.metric strong{display:block;font-size:27px}.tiny{font-size:13px}.tag{font-size:12px;background:#e5eef8;color:#1e4f82;padding:5px 9px;border-radius:20px}ol{padding-left:23px;line-height:1.9}.center{text-align:center}.hero{padding:35px;background:linear-gradient(110deg,#173a62,#2a68a4);color:white;border-radius:18px;margin-bottom:20px}.hero p{color:#d8e7f7}.status{font-size:13px;color:#60758b}.customer-figure{filter:drop-shadow(0 12px 15px #122c3c35)}@media(max-width:980px){.two-col{grid-template-columns:1fr}.scene{height:320px}}@media(max-width:700px){.layout{display:block}.sidebar{padding:12px;gap:8px}.brand{font-size:19px}.nav{display:flex;overflow-x:auto;gap:5px}.nav button{white-space:nowrap;padding:10px}.side-bottom{display:none}.main{padding:14px}.scene{height:300px}.bubble{font-size:13px;padding:12px;max-width:54%}h1{font-size:24px}.card{padding:15px}.topline{margin-bottom:12px}}@media print{.sidebar,.actions,.nav{display:none}.layout{display:block}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="pill">SKILLS TRAINING OF SUFFOLK</div><h1>Sales Practice Lab</h1><p class="muted">Independent interactive sales training · Fictional customers only</p><form id="loginForm"><label for="emp">Enter any four-digit employee ID</label><p><input id="emp" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="0000" required autocomplete="off"></p><button class="primary" style="width:100%">Enter Training Lab</button></form></div></div>
<div id="app" class="layout hidden"><aside class="sidebar"><div class="brand">▥ SKILLS<small>Sales Practice Lab</small></div><nav id="nav" class="nav" aria-label="Training sections"></nav><div class="side-bottom"><div id="employee" class="tiny" style="margin-bottom:12px"></div><button id="signout">Sign Out</button></div></aside><main class="main"><div class="topline"><div><h1 id="pageTitle">Sales Practice Lab</h1><div id="subtitle" class="muted"></div></div><div class="pill" id="empPill"></div></div><div id="content"></div></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const categories=[['retail','Retail Sales','Help customers choose products and close sales.'],['phone','Phone Sales','Qualify leads and respond to concerns over the phone.'],['b2b','B2B Sales','Understand business challenges and propose solutions.'],['service','Service Sales','Recommend service plans and earn customer trust.']];
const stages=['Greeting & rapport','Discover needs','Present recommendation','Handle objections','Close or follow up'];
const scenarios=[
{id:'retail1',category:'retail',title:'The First-Time Buyer',name:'Maria',role:'College student',personality:'Friendly, budget-conscious',goal:'Understand needs and recommend a suitable laptop.',setting:'Electronics Store',palette:['#d6e2ec','#9db7cf'],dialogue:[
{say:"Hi! I'm starting college and need a laptop, but I don't know what to buy.",options:[["Welcome! What will you mainly use it for?",3,"Great opening: you invite the customer to explain her needs."],["The most expensive one is the best.",0,"Avoid recommending a product before understanding the customer."],["Our laptops are over there.",1,"You directed her to products but missed an opportunity to help."],["You should check online first.",0,"This ends the conversation instead of offering assistance."]]},
{say:"Mostly classes, writing papers and video calls. I don't want to spend too much.",options:[["What budget feels comfortable, and do you need to carry it to class?",3,"Excellent: budget and portability are key buying criteria."],["You should get our premium gaming laptop.",0,"This recommendation ignores her stated needs."],["All laptops are basically the same.",0,"That is misleading and does not help her decide."],["Maybe come back when you have more money.",0,"A dismissive response can damage trust."]]},
{say:"My budget is around $650, and I carry my bag everywhere.",options:[["A lightweight model within $650 with solid battery life sounds suitable. Want to compare two?",3,"You connect product benefits directly to her priorities."],["I can show you one for $1,800.",0,"This is far outside the customer's budget."],["Just buy whichever is on sale.",1,"Price matters, but fit and reliability also matter."],["You don't need to worry about battery life.",0,"Portability and battery life are relevant to her."]]},
{say:"I saw a cheaper laptop online. Why should I buy here?",options:[["Let's compare the exact specifications, warranty and return options so you can choose confidently.",3,"You respond transparently and demonstrate value without pressure."],["That online store is probably dishonest.",0,"Avoid unsupported claims about competitors."],["You have to buy today for this deal.",0,"Artificial urgency damages trust."],["I guess you should buy online.",1,"Respect the choice, but you can still offer a helpful comparison."]]},
{say:"That makes sense. What should I do next?",options:[["Would you like to review the two suitable options and choose the one you prefer?",3,"Strong close: clear next step without pressure."],["I'll ring up the expensive one.",0,"Never assume the customer chose a product."],["You can decide later. Goodbye.",1,"A follow-up option can help, but clarify her preference first."],["Give me your payment card now.",0,"Avoid pressuring the customer or collecting real payment data."]]}]},
{id:'retail2',category:'retail',title:'The Gift Shopper',name:'Jordan',role:'Holiday shopper',personality:'Rushed, uncertain',goal:'Recommend a thoughtful gift without exceeding the budget.',setting:'Gift Shop',palette:['#eadfd5','#c8ad96'],dialogue:[
{say:"I need a gift for my sister, and I'm in a hurry.",options:[["Happy to help. What does she enjoy, and what budget are you working with?",3,"You quickly identify needs while respecting the customer's time."],["Buy this expensive gift set.",0,"A recommendation without discovery may miss the mark."],["You should have shopped earlier.",0,"Avoid criticizing the customer."],["Everything is on those shelves.",1,"Direction alone is not tailored service."]]},
{say:"She loves cooking, and I can spend about $40.",options:[["Would she prefer useful kitchen tools or something fun for entertaining?",3,"You narrow the selection with a helpful question."],["Our $150 appliance is perfect.",0,"You ignored the stated budget."],["I don't know anything about cooking.",0,"You can still help by asking about preferences."],["Just give her cash.",1,"That may work, but doesn't address the request for a gift."]]},
{say:"She likes hosting friends for dinner.",options:[["A serving board or spice set under $40 could be a good fit. Want to see both?",3,"You connect the recommendation to her interests."],["She definitely needs a blender.",0,"This ignores her specific interest."],["Anything in the store will work.",1,"A vague answer is not useful."],["We only sell things over $100.",0,"Don't invent restrictions."]]},
{say:"The serving board looks nice, but is it good quality?",options:[["Let's look at the material and care instructions together.",3,"Transparent product details help the customer assess quality."],["It's perfect. Trust me.",0,"Avoid unsupported guarantees."],["Quality doesn't matter for gifts.",0,"This dismisses a legitimate concern."],["Maybe pick something else.",1,"You can address the concern before changing recommendations."]]},
{say:"Great, I think she'll like it.",options:[["Would you like this one gift-wrapped before checkout?",3,"You offer a relevant final service and a clear next step."],["You must also buy three accessories.",0,"Avoid unwanted pressure."],["I'll charge your card without asking.",0,"Consent is essential."],["See you next time.",1,"You missed the opportunity to complete the purchase."]]}]},
{id:'phone1',category:'phone',title:'The Curious Lead',name:'Alex',role:'Prospective customer',personality:'Cautious, busy',goal:'Qualify the lead and arrange a useful next step.',setting:'Phone Conversation',palette:['#d8e8ee','#9dbac8'],dialogue:[
{say:"Hello? Who is calling?",options:[["Hi, I'm with the training company. Is this a convenient time for a brief call?",3,"Identify yourself and respect the person's time."],["I need you to buy today.",0,"This is pushy and skips identification."],["Don't worry about who I am.",0,"Transparency matters."],["Can I have your credit card?",0,"Never request real payment details in training."]]},
{say:"I have two minutes. What is this about?",options:[["We help teams practice customer conversations. Is improving sales training a current priority?",3,"You give a concise value statement and qualifying question."],["Let me read our full brochure.",0,"This ignores the time limit."],["Our service is the best anywhere.",0,"Unsupported superlatives are unhelpful."],["You probably don't need this.",1,"Avoid dismissing a potential need."]]},
{say:"We have new staff, but training takes a lot of time.",options:[["What part of onboarding takes the most time right now?",3,"You uncover the actual problem."],["Then you need our most expensive plan.",0,"Don't jump to pricing."],["Just tell staff to learn faster.",0,"Dismissive and impractical."],["All companies have that issue.",1,"Acknowledge and explore their specific challenge."]]},
{say:"I'm worried another tool will be complicated.",options:[["That's reasonable. Would a short walkthrough of a sample scenario help you evaluate it?",3,"You address the concern with a low-pressure next step."],["It's easy, I promise.",1,"Specific evidence is more useful than a promise."],["You're overthinking it.",0,"Don't dismiss concerns."],["You must sign up first.",0,"Avoid forcing commitment before evaluation."]]},
{say:"Maybe. Can you send me information?",options:[["Absolutely. What topics would be most useful, and may I follow up next week?",3,"You confirm relevance and seek permission for follow-up."],["I'll send you everything every day.",0,"Unwanted contact is not appropriate."],["No, you have to buy now.",0,"Respect the request."],["Okay, goodbye.",1,"You missed a chance to tailor the information."]]}]},
{id:'b2b1',category:'b2b',title:'The Small Business Owner',name:'Taylor',role:'Shop owner',personality:'Practical, skeptical',goal:'Understand operational pain points before proposing a service.',setting:'Business Meeting',palette:['#d9e5d9','#a4bda5'],dialogue:[
{say:"We already have a system. Why would I need yours?",options:[["That's helpful context. What's working well, and what would you improve?",3,"You explore the current solution without criticizing it."],["Your system is outdated.",0,"Don't assume or insult."],["Everyone needs our product.",0,"One-size-fits-all selling is ineffective."],["Then I guess we're done.",1,"There may still be an unmet need."]]},
{say:"Scheduling takes too much of my staff's time.",options:[["Roughly how many hours per week does your team spend handling bookings?",3,"Quantifying the pain point helps assess value."],["Buy our largest package.",0,"Too early for a recommendation."],["That doesn't sound serious.",0,"Don't dismiss operational costs."],["Just hire more staff.",1,"Explore lower-cost improvements first."]]},
{say:"Maybe eight hours a week. But I'm on a tight budget.",options:[["Let's compare the potential time savings against the monthly cost before deciding.",3,"You connect benefits to a measurable business concern."],["Budget shouldn't matter.",0,"Respect the customer's constraints."],["Our most expensive plan is best.",0,"The solution should fit the need."],["You should cut employee hours.",0,"Avoid speculative operational advice."]]},
{say:"What if the setup disrupts my business?",options:[["We could review the setup steps and discuss a small pilot before a full rollout.",3,"A pilot can reduce uncertainty and risk."],["Nothing can ever go wrong.",0,"Avoid unrealistic guarantees."],["You'll have to shut down for a week.",0,"Don't invent requirements."],["That's your problem.",0,"This undermines trust."]]},
{say:"A pilot might work. What's next?",options:[["Let's agree on one goal, a short pilot period and how we'll measure results.",3,"A clear, measurable next step is appropriate."],["Sign a long contract now.",0,"That ignores the pilot request."],["Pay before I explain anything.",0,"Avoid pressure."],["We'll figure it out someday.",1,"A vague next step risks losing momentum."]]}]},
{id:'service1',category:'service',title:'The Appointment Inquiry',name:'Sam',role:'Service customer',personality:'Careful, value-focused',goal:'Discover service needs and recommend an appropriate option.',setting:'Service Desk',palette:['#e4deeb','#b9abc9'],dialogue:[
{say:"I'm interested in your monthly service, but I don't know which plan I need.",options:[["I'd be happy to help. What would you like the service to accomplish?",3,"Start with the customer's desired outcome."],["Always choose the most expensive plan.",0,"Avoid pushing unnecessary upgrades."],["Just pick one online.",1,"Offer help before redirecting."],["You have to decide now.",0,"Don't create pressure."]]},
{say:"I mainly want to save time and avoid missed appointments.",options:[["How are appointments handled today, and where do most problems happen?",3,"You explore the workflow and pain points."],["You need every add-on.",0,"Only recommend relevant features."],["Missed appointments aren't important.",0,"This dismisses their concern."],["That's impossible to fix.",0,"Avoid premature conclusions."]]},
{say:"Most calls come in while I'm helping customers.",options:[["A booking assistant could help with those calls. Would you prefer a basic or more hands-on setup?",3,"You link the service to the stated need and clarify preferences."],["You should stop answering customers.",0,"This is impractical."],["Our largest plan is mandatory.",0,"Don't invent requirements."],["Just turn off your phone.",0,"That could worsen missed bookings."]]},
{say:"I'm worried about paying every month.",options:[["Let's review the monthly cost, what's included, and whether it fits your expected time savings.",3,"You acknowledge the concern and clarify value."],["It's not expensive.",1,"Affordability is relative; discuss specifics."],["Don't worry about money.",0,"This dismisses a legitimate concern."],["You can't cancel, ever.",0,"Never invent contractual terms."]]},
{say:"That helps. Can I think about it?",options:[["Of course. Would a written summary and an optional follow-up be useful?",3,"You respect the decision and offer a practical next step."],["No, decide now.",0,"Avoid pressure."],["I'll enroll you anyway.",0,"Never enroll without consent."],["Then don't contact us again.",0,"Keep the relationship respectful."]]}]}
];
let employee='',section='home',active=null,step=0,selected=null,showFeedback=false,history=[],completed=[],sessionStarted=Date.now();
function nav(){const items=[['home','⌂ Home'],...categories.map(x=>[x[0],({retail:'▣',phone:'☎',b2b:'▤',service:'▦'}[x[0]])+' '+x[1]]),['performance','▥ Performance'],['help','ⓘ Help']];$('nav').innerHTML=items.map(([k,v])=>'<button data-nav="'+k+'" class="'+(section===k?'active':'')+'">'+v+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.nav))}
function go(k){section=k;active=null;selected=null;showFeedback=false;render()}
function start(id){active=scenarios.find(s=>s.id===id);section=active.category;step=0;selected=null;showFeedback=false;history=[];render()}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function sceneSVG(s){const a=s.palette[0],b=s.palette[1];return '<svg viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated fictional customer '+escapeHTML(s.name)+' in '+escapeHTML(s.setting)+'"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient><linearGradient id="shirt" x2="1"><stop stop-color="#284c73"/><stop offset="1" stop-color="#466c93"/></linearGradient></defs><rect width="800" height="420" fill="url(#bg)"/><rect x="0" y="75" width="800" height="20" fill="#ffffff66"/><rect x="0" y="135" width="800" height="8" fill="#ffffff55"/><rect x="0" y="200" width="800" height="12" fill="#ffffff66"/><g opacity=".3" fill="#fff"><rect x="50" y="95" width="80" height="90" rx="8"/><rect x="155" y="110" width="70" height="80" rx="8"/><rect x="570" y="100" width="80" height="85" rx="8"/><rect x="690" y="115" width="55" height="75" rx="8"/></g><g class="customer-figure"><ellipse cx="260" cy="430" rx="195" ry="160" fill="url(#shirt)"/><path d="M183 278Q260 325 333 278L350 420H170Z" fill="#f1f4f7"/><rect x="233" y="252" width="55" height="68" rx="24" fill="#bd8064"/><ellipse cx="260" cy="174" rx="93" ry="117" fill="#392e34"/><ellipse cx="260" cy="189" rx="74" ry="97" fill="#d79b7c"/><path d="M185 172Q176 62 255 65Q348 60 339 168Q305 128 281 117Q237 156 185 172Z" fill="#352b31"/><ellipse cx="229" cy="192" rx="7" ry="5" fill="#2d303a"/><ellipse cx="291" cy="192" rx="7" ry="5" fill="#2d303a"/><path d="M244 233Q260 245 278 233" stroke="#8c4c4b" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M207 177Q226 170 239 179M280 179Q294 170 310 178" stroke="#3d3030" stroke-width="5" fill="none" stroke-linecap="round"/></g><rect x="18" y="18" width="160" height="33" rx="15" fill="#fff" opacity=".85"/><text x="33" y="40" fill="#274765" font-family="Arial" font-size="15">'+escapeHTML(s.setting)+'</text></svg>'}
function render(){nav();$('pageTitle').textContent=active?active.title:section==='home'?'Sales Practice Lab':section==='performance'?'Performance':section==='help'?'Training Help':categories.find(c=>c[0]===section)?.[1]||'Sales Practice Lab';$('subtitle').textContent=active?'Scenario '+(step+1)+' of '+active.dialogue.length:'Practice real conversations with fictional customers';$('empPill').textContent='Employee '+employee;const c=$('content');if(active)return renderScenario(c);if(section==='home'){c.innerHTML='<div class="hero"><h2>Practice conversations. Build confidence.</h2><p>Choose a sales environment, meet a fictional customer and select how you would respond. Get coaching after each decision.</p><button class="primary" data-go="retail">Start Retail Sales</button></div><h2>Choose your practice environment</h2><div class="scenario-list">'+categories.map(x=>'<button class="scenario" data-go="'+x[0]+'"><span class="tag">Practice module</span><strong>'+x[1]+'</strong><p>'+x[2]+'</p><span>Explore scenarios →</span></button>').join('')+'</div><div class="card" style="margin-top:20px"><h3>How it works</h3><p class="muted">1. Select a scenario → 2. Read the customer\'s dialogue → 3. Choose a response → 4. Review coaching → 5. Complete the conversation and view your results.</p></div>'}else if(section==='performance')renderPerformance(c);else if(section==='help'){c.innerHTML='<div class="card"><h2>How to use the lab</h2><ol><li>Pick one of the four sales environments.</li><li>Select a customer scenario.</li><li>Read the customer\'s dialogue bubble.</li><li>Choose one of four responses, then submit.</li><li>Review the coaching explanation and continue.</li><li>At the end, review your performance and retry to improve.</li></ol><p>Customers, products and conversations are fictional. This version uses scripted branching-style coaching and does not use AI or collect real payment information.</p><p class="muted">Training results are stored in this browser for this session only and reset on refresh.</p></div>'}else{const list=scenarios.filter(s=>s.category===section);c.innerHTML='<div class="card"><h2>'+categories.find(x=>x[0]===section)[1]+'</h2><p>Choose a customer to begin a five-step conversation.</p></div><div class="scenario-list">'+list.map(s=>'<button class="scenario" data-start="'+s.id+'"><span class="tag">'+escapeHTML(s.setting)+'</span><strong>'+escapeHTML(s.title)+'</strong><p>Meet '+escapeHTML(s.name)+' · '+escapeHTML(s.personality)+'</p><span>Begin scenario →</span></button>').join('')+'</div>'}c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));c.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start))}
function renderScenario(c){const s=active,node=s.dialogue[step],last=step===s.dialogue.length-1;const labels=['A','B','C','D'];c.innerHTML='<div class="two-col"><div><div class="card"><div class="topline"><div><span class="tag">'+categories.find(x=>x[0]===s.category)[1]+'</span><h2 style="margin-top:8px">'+escapeHTML(s.title)+'</h2></div><span class="pill">Step '+(step+1)+' / '+s.dialogue.length+'</span></div><div class="stepbar">'+s.dialogue.map((_,i)=>'<span class="'+(i<step?'done':i===step?'current':'')+'"></span>').join('')+'</div><div class="scene">'+sceneSVG(s)+'<div class="bubble">'+escapeHTML(node.say)+'</div></div><h3 style="margin-top:20px">How would you respond?</h3><div class="answers">'+node.options.map((opt,i)=>'<button class="answer '+(selected===i?'selected':'')+'" data-answer="'+i+'" '+(showFeedback?'disabled':'')+'><span class="letter">'+labels[i]+'</span><span>'+escapeHTML(opt[0])+'</span></button>').join('')+'</div>'+(showFeedback?'<div class="feedback '+(node.options[selected][1]===3?'good':'')+'"><strong>Coaching feedback</strong><p>'+escapeHTML(node.options[selected][2])+'</p><p><strong>Points: '+node.options[selected][1]+' / 3</strong></p></div>':'')+'<div class="actions"><button class="primary" id="next" '+(!showFeedback&&selected===null?'disabled':'')+'>'+(showFeedback?(last?'Finish Scenario':'Continue →'):'Submit Answer →')+'</button></div></div></div><div><div class="card"><h3>Customer Profile</h3><div class="profile"><div class="avatar">☺</div><div><strong>'+escapeHTML(s.name)+'</strong><div class="tiny muted">'+escapeHTML(s.role)+'</div></div></div><p><strong>Personality:</strong> '+escapeHTML(s.personality)+'</p><p><strong>Situation:</strong> '+escapeHTML(s.setting)+'</p></div><div class="card"><h3>◎ Your Goal</h3><p>'+escapeHTML(s.goal)+'</p><h3>Helpful reminders</h3><ul><li>Ask questions before recommending.</li><li>Focus on the customer's stated needs.</li><li>Explain benefits without pressure.</li><li>Confirm a respectful next step.</li></ul></div><div class="card"><h3>Scenario Progress</h3><ol>'+stages.map((x,i)=>'<li style="'+(i===step?'font-weight:800;color:#225f9c':i<step?'color:#319368':'color:#8191a2')+'">'+x+'</li>').join('')+'</ol></div></div></div>';c.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.answer);renderScenario(c)});$('next').onclick=()=>{if(!showFeedback){if(selected===null)return;showFeedback=true;renderScenario(c);return}history.push({step,choice:selected,points:node.options[selected][1],response:node.options[selected][0],feedback:node.options[selected][2]});if(last){const total=history.reduce((n,x)=>n+x.points,0);completed.push({id:s.id,title:s.title,category:s.category,total,max:s.dialogue.length*3,date:new Date().toLocaleString(),history:[...history]});active=null;section='performance';render()}else{step++;selected=null;showFeedback=false;renderScenario(c)}}}
function renderPerformance(c){const latest=completed.at(-1),avg=completed.length?Math.round(completed.reduce((n,r)=>n+r.total/r.max*100,0)/completed.length):0;c.innerHTML='<div class="card"><h2>Training Performance</h2><div class="metric-grid"><div class="metric"><strong>'+completed.length+'</strong>Scenarios completed</div><div class="metric"><strong>'+avg+'%</strong>Average coaching score</div><div class="metric"><strong>'+completed.filter(x=>x.total===x.max).length+'</strong>Perfect scenarios</div></div><p class="muted tiny">Scores are coaching indicators for practice, not employment evaluations.</p></div>'+(latest?'<div class="card"><h2>Latest: '+escapeHTML(latest.title)+'</h2><p><strong>'+latest.total+' / '+latest.max+' points ('+Math.round(latest.total/latest.max*100)+'%)</strong></p><ol>'+latest.history.map(h=>'<li><strong>'+escapeHTML(stages[h.step])+'</strong> · '+h.points+'/3<br>'+escapeHTML(h.feedback)+'</li>').join('')+'</ol><button class="primary" data-retry="'+latest.id+'">Practice Again</button></div>':'<div class="card center"><h3>No completed scenarios yet</h3><p>Start a sales conversation to see your coaching results.</p><button class="primary" data-go="retail">Start Practicing</button></div>')+(completed.length?'<div class="card"><h3>Completed Scenarios</h3>'+completed.map(x=>'<p>'+escapeHTML(x.title)+' — '+x.total+'/'+x.max+' · '+escapeHTML(x.date)+'</p>').join('')+'</div>':'');c.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>start(b.dataset.retry));c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
$('loginForm').onsubmit=e=>{e.preventDefault();if(!/^\d{4}$/.test($('emp').value))return;employee=$('emp').value;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('employee').textContent='Employee '+employee;render()};$('signout').onclick=()=>{employee='';$('emp').value='';$('app').classList.add('hidden');$('login').classList.remove('hidden');active=null;section='home'};
</script></body></html>
